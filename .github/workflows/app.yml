name: React application
on:
  push:
    paths: ['src/**', 'input/**', 'package.json', 'tsconfig.json', 'vite.config.ts', 'index.html', 'tests/**', 'vitest.config.ts', '.github/workflows/app.yml']
  pull_request:
    paths: ['src/**', 'input/**', 'package.json', 'tsconfig.json', 'vite.config.ts', 'index.html', 'tests/web.test.mjs', '.github/workflows/app.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
